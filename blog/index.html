<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Personal website of Ayush Tambde" />
        <title>Blog | Ayush Tambde</title>
        <style>
            :root {
                --text: #111;
                --muted: #666;
                --line: #ddd;
                --link: #000;
                --bg: #fff;
                --max-width: min(100%, 700px);
            }

            html,
            body {
                margin: 0;
                padding: 0;
                font-family: Georgia, 'Times New Roman', serif;
                color: var(--text);
                background: var(--bg);
                line-height: 1.6;
            }

            body {
                max-width: 900px;
                margin: 0 auto;
                padding: 2.5rem 1.2rem;
            }

            a {
                color: var(--link);
                text-decoration: none;
                border-bottom: 1px solid transparent;
            }

            a:hover {
                border-bottom-color: var(--text);
            }

            h1,
            h2,
            h3 {
                margin: 0 0 0.6rem;
                font-weight: 600;
                line-height: 1.3;
            }

            h1 {
                font-size: 1.95rem;
            }

            h2 {
                margin-top: 1.4rem;
                font-size: 1.35rem;
            }

            h3 {
                font-size: 1.1rem;
            }

            p {
                margin: 0 0 0.8rem;
                max-width: var(--max-width);
            }

            ul,
            ol {
                max-width: var(--max-width);
                margin: 0.35rem 0 0.9rem;
                padding-left: 1.2rem;
            }

            li {
                margin-bottom: 0.4rem;
            }

            table {
                border-collapse: collapse;
                width: 100%;
                max-width: var(--max-width);
                margin: 0.8rem 0 1.2rem;
                display: block;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            th,
            td {
                border: 1px solid var(--line);
                padding: 0.45rem 0.55rem;
                text-align: left;
                vertical-align: top;
                font-size: 0.94rem;
            }

            th {
                background: #fafafa;
            }

            code {
                font-family: Menlo, Monaco, Consolas, 'Courier New', monospace;
                font-size: 0.93em;
            }

            .blogPostImage {
                width: min(100%, 760px);
                height: auto;
                display: block;
                margin: 0.2rem 0 1rem;
            }

            .blogTagToken {
                color: #444;
            }

            .katex {
                font-size: 1.08em;
            }

            .katex-display {
                font-size: 1.14em;
                overflow-x: auto;
                overflow-y: hidden;
            }

            @media only screen and (max-width: 600px) {
                body {
                    padding: 2rem 0.8rem 2rem;
                }

                .katex {
                    font-size: 1.18em;
                }

                .katex-display {
                    font-size: 1.28em;
                }

                table th,
                table td {
                    font-size: 0.88rem;
                }
            }
        </style>
        <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" />
    </head>
    <body>
        <main>
    <p><a href="/">← Home</a></p>
    <h1>Blog</h1>
    <ul>
      <li><a href="/blog/tree-search-distillation-for-language-models-using-ppo">Tree Search Distillation for Language Models using PPO</a></li>
    </ul>
  </main>
        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js" defer></script>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                if (window.renderMathInElement) {
                    window.renderMathInElement(document.body, {
                        delimiters: [
                            { left: '\\$', right: '\\$', display: true },
                            { left: '\\(', right: '\\)', display: false },
                            { left: '\\[', right: '\\]', display: true },
                            { left: '$', right: '$', display: false }
                        ],
                        throwOnError: false,
                    });
                }
            });
        </script>
    </body>
</html>
